<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kotoba Live · 设置</title><link rel="stylesheet" href="ui.css"></head>
<body><main class="settings">
  <div class="brand"><span class="brand-name"><img src="icons/icon-48.png" width="32" height="32" alt="">Kotoba Live</span><span class="tag">字幕设置</span></div>
  <label class="ui-language"><span>界面语言</span><select data-ui-language aria-label="界面语言"><option value="auto">跟随浏览器</option><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
  <h1>把字幕调成你的样子。</h1><p class="muted">调整阅读体验和内容提示。保存后，重新开始翻译即可应用。</p>
  <form id="form">
    <label>账户连接码<small>登录 <a href="https://kotoba-beta.dracohu2025.workers.dev/pricing#account" target="_blank" rel="noreferrer">Kotoba 账户</a> 获取，无需先付费。最长一小时有效，过期后请重新获取；请勿分享。</small><input id="token" type="password" required minlength="24" autocomplete="off" placeholder="粘贴账户页的连接码"></label>
    <label>内容背景 <small>可选，例如「产品设计课程」或「日本旅行访谈」，最多 1000 字。用于帮助理解这段内容，请勿填写敏感信息。</small><textarea id="context" maxlength="1000" placeholder="这段内容主要在讲什么？"></textarea></label>
    <label>日语术语<small>可选，使用逗号或换行分隔；最多 30 个，每个最多 60 字。</small><textarea id="terms" placeholder="例如：生成AI、デザインシステム"></textarea></label>
    <label class="check"><input id="showOriginal" type="checkbox" checked>同时显示日语原文</label>
    <label>译文字幕大小 <span id="sizeLabel">28 px</span><input id="fontSize" type="range" min="18" max="42" value="28"></label>
    <label>字幕背景深浅 <span id="opacityLabel">90%</span><input id="opacity" type="range" min="0" max="100" value="90"></label>
    <details class="advanced"><summary>高级连接设置</summary>
      <p class="hint">通常无需修改。已配置自定义连接的用户可在这里调整。</p>
      <label>连接地址<input id="relayUrl" required value="wss://kotoba-beta.dracohu2025.workers.dev/stream" spellcheck="false"></label>
      <button type="button" class="secondary" id="useCloud">恢复默认连接</button>
    </details>
    <div class="actions"><button type="submit">保存设置</button><span id="feedback" role="status"></span></div>
  </form>
  <p class="muted">仅在你开启翻译后读取当前标签页的声音，并通过网络处理以生成字幕。Kotoba 不保存音频或字幕，停止翻译后不再读取。</p>
  <a href="https://kotoba-beta.dracohu2025.workers.dev/pricing#account" target="_blank" rel="noreferrer">管理我的账户与时长 ↗</a>
</main><script type="module" src="options.js"></script></body></html>
