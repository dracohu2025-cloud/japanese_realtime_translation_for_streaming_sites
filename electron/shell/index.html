<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' blob:" />
  <title>Kotoba Live</title>
  <link rel="stylesheet" href="./shell.css" />
</head>
<body>
  <header class="toolbar">
    <div class="nav">
      <button type="button" id="back" title="后退" aria-label="后退">←</button>
      <button type="button" id="forward" title="前进" aria-label="前进">→</button>
      <button type="button" id="reload" title="刷新" aria-label="刷新">↻</button>
    </div>
    <form id="url-form" class="url-form">
      <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="输入网址，在应用内打开任意流媒体页面" />
    </form>
    <div class="actions">
      <button type="button" id="toggle" class="primary">开始翻译</button>
    </div>
  </header>

  <div id="viewport" aria-hidden="true"></div>

  <footer class="status">
    <div id="state">准备中…</div>
    <div id="meter" title="音量"><span></span></div>
    <div id="detail"></div>
  </footer>

  <script type="module" src="./shell.js"></script>
</body>
</html>
