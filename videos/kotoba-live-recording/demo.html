<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Kotoba · 日语听力工作室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ec;color:#203e35;font-family:"PingFang SC",sans-serif}header{height:84px;display:flex;align-items:center;justify-content:space-between;margin:0 56px;border-bottom:1px solid #ced8ca}header div{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:650}header img{width:38px;height:38px}header span{font-size:12px;letter-spacing:2px;color:#61766b}main{margin:34px 56px;display:grid;grid-template-columns:1fr 265px;gap:32px}.player{height:480px;background:#16483e;border-radius:18px;position:relative;overflow:hidden;color:#f4f2e7;padding:42px}.eyebrow{font-size:11px;letter-spacing:3px;color:#c4d3b9}.player h1{font:46px/1.55 "Songti SC",serif;font-weight:400;margin:30px 0 20px}.player h1 span{color:#d4e4b9}.wave{position:absolute;right:45px;top:105px;height:110px;display:flex;align-items:center;gap:9px}.wave i{width:10px;background:#c8dcae;border-radius:10px;opacity:.55;height:35px;animation:wave 1.3s ease-in-out infinite;animation-play-state:paused}.wave i:nth-child(2n){height:85px;animation-delay:-.3s}.wave i:nth-child(3n){height:58px;animation-delay:-.6s}.playing .wave i{animation-play-state:running}@keyframes wave{50%{transform:scaleY(.38)}}.controls{position:absolute;bottom:26px;left:35px;right:35px;display:flex;align-items:center;gap:18px}button{border:0;background:#dfebc7;color:#173f35;padding:12px 24px;border-radius:30px;font:600 14px "PingFang SC";cursor:pointer}.track{height:3px;background:#ffffff30;flex:1}.track div{height:100%;width:0;background:#d5e5bb}.time{font:12px ui-monospace,monospace;color:#d8e2d9}aside{padding:25px 0}aside .kicker{font-size:11px;letter-spacing:2px;color:#758579}aside h2{font:32px/1.5 "Songti SC",serif;margin:25px 0}aside p{font-size:14px;line-height:1.9;color:#697b70}.divider{width:42px;border-top:2px solid #94ae85;margin:30px 0}.foot{display:flex;justify-content:space-between;margin:0 56px;color:#7c8a7d;font-size:11px;letter-spacing:1px}audio{display:none}
</style>
<header><div><img src="assets/kotoba-logo.png" alt="">Kotoba Live</div><span>JAPANESE LISTENING STUDIO</span></header>
<main><section class="player"><div class="eyebrow">01 / A LITTLE, EVERY DAY</div><h1>好きなことから、<br><span>少しずつ。</span></h1><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="controls"><button id="play">播放日语音频</button><div class="track"><div id="progress"></div></div><span class="time" id="clock">00:00 / 00:14</span></div></section><aside><div class="kicker">TODAY'S LISTENING</div><h2>每天一点，<br>听见更多。</h2><p>一段关于语言学习的日语。<br>让熟悉的兴趣，成为新的开始。</p><div class="divider"></div><p>打开 Kotoba 插件，<br>选择中文并开始翻译。</p></aside></main><div class="foot"><span>原创日语文稿 · 合成语音演示</span><span>播放音频，实际生成实时字幕</span></div>
<audio id="audio" src="assets/japanese-study-padded.wav" preload="auto"></audio><script>
const audio=document.getElementById('audio'),button=document.getElementById('play');
button.onclick=()=>audio.paused?audio.play():audio.pause();
audio.onplay=()=>{document.body.classList.add('playing');button.textContent='暂停播放'};
audio.onpause=()=>{document.body.classList.remove('playing');button.textContent=audio.ended?'再听一遍':'继续播放'};
audio.ontimeupdate=()=>{document.getElementById('progress').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('clock').textContent='00:'+String(Math.floor(audio.currentTime)).padStart(2,'0')+' / 00:35'};
</script></html>
